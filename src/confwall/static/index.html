<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference Deadlines Wall</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="slideshow-container" class="slideshow-container">
    <div id="bg-image-container" class="bg-image-container">
      <img id="slide-image" src="" alt="" class="slide-image">
    </div>
    
    <div class="gradient-overlay"></div>

    <div class="top-controls">
      <div id="slide-counter" class="slide-counter" aria-live="polite"></div>
      <button id="fullscreen-btn" class="control-btn" title="Toggle Fullscreen (Press F)" aria-label="Toggle Fullscreen">
        <svg class="icon-fullscreen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <svg class="icon-exit-fullscreen hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
        </svg>
      </button>
    </div>

    <header class="slide-header">
      <div class="header-badges">
        <div class="site-header-badge">
          <svg class="calendar-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Upcoming Conferences</span>
          <span class="badge-subtext" id="badge-window"></span>
        </div>
        <div class="focus-pill" id="slide-focus"></div>
        <div class="publisher-pill" id="slide-publisher"></div>
        <div class="rank-badges" id="slide-ranks"></div>
      </div>
      <h1 class="conference-title">
        <a id="slide-url" href="#" target="_blank" rel="noopener noreferrer">
          <span id="slide-acronym"></span>
          <span id="slide-year"></span>
        </a>
      </h1>
      <h2 class="conference-name" id="slide-fullname"></h2>
    </header>

    <main class="slide-caption">
      <div id="slide-countdown" class="countdown-badge hidden">
        <span class="countdown-pulse-dot"></span>
        <span class="countdown-text" id="slide-countdown-text"></span>
      </div>

      <div class="location-text" id="slide-location"></div>

      <div class="deadlines-container">
        <div class="abstract-box hidden" id="slide-abstract-box">
          <span class="abstract-label">Abstract due:</span>
          <span class="abstract-value" id="slide-abstract"></span>
        </div>
        <div class="deadline-box">
          <span class="deadline-label">Submission due:</span>
          <span class="deadline-value" id="slide-deadline"></span>
          <span class="deadline-comment" id="slide-comment"></span>
        </div>
      </div>
    </main>

    <footer class="slide-footer">
      <span id="photo-credit"></span>
    </footer>

    <div id="empty-state" class="empty-state hidden">
      <div class="site-header-badge">
        <svg class="calendar-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Upcoming Conferences</span>
        <span class="badge-subtext" id="empty-badge-window"></span>
      </div>
      <div class="empty-message" id="empty-message">
        No selected conference submission deadlines in the next four months.
      </div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
